<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autohub PCD Database</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #657181;
      --line: #d9e0e8;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --warning: #9a5b00;
      --warning-bg: #fff5db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .topbar {
      background: #111827;
      color: #fff;
      border-bottom: 1px solid #263244;
    }
    .nav {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 58px;
      padding: 0 18px;
      overflow-x: auto;
    }
    .brand {
      font-weight: 700;
      font-size: 20px;
      white-space: nowrap;
      margin-right: 8px;
    }
    .nav a {
      color: #dbeafe;
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
      padding: 8px 0;
    }
    .nav a.active {
      color: #5eead4;
      border-bottom: 2px solid #5eead4;
    }
    .langbar {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .langbar button {
      min-height: 30px;
      border: 1px solid #334155;
      color: #e5e7eb;
      background: #1f2937;
      border-radius: 6px;
      padding: 4px 8px;
      text-align: center;
      font-size: 12px;
      white-space: nowrap;
    }
    .langbar button.selected {
      background: #0f766e;
      color: #fff;
      border-color: #5eead4;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .lead {
      margin: 0 0 20px;
      color: var(--muted);
      max-width: 780px;
      line-height: 1.5;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 18px 0 10px;
      flex-wrap: wrap;
    }
    input {
      width: min(100%, 460px);
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 15px;
      background: #fff;
    }
    .copy-link {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      text-align: center;
      font-size: 14px;
      padding: 0 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-link:hover {
      background: var(--accent-dark);
      color: #fff;
    }
    .layout {
      display: grid;
      grid-template-columns: 230px 290px 1fr;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
    }
    .panel h2 {
      font-size: 16px;
      margin: 0;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
    }
    .list {
      display: grid;
      gap: 4px;
      padding: 10px;
    }
    .quick-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 10px;
    }
    .quick-filters button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #334155;
      text-align: center;
      font-size: 13px;
      padding: 6px 12px;
    }
    .quick-filters button:hover,
    .quick-filters button.selected {
      border-color: #99d5cf;
      background: #e6f6f4;
      color: var(--accent-dark);
    }
    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }
    .count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .summary {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      min-height: 20px;
    }
    .details-title {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.25;
      color: var(--text);
    }
    .details-title span {
      color: var(--muted);
      font-weight: 400;
    }
    .guide {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      color: var(--muted);
      line-height: 1.45;
      font-size: 14px;
    }
    .guide strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 15px;
    }
    button {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-size: 15px;
      padding: 8px 10px;
      cursor: pointer;
    }
    button:hover,
    button.selected {
      background: #e6f6f4;
      color: var(--accent-dark);
    }
    .empty {
      padding: 18px;
      color: var(--muted);
      line-height: 1.5;
    }
    .notice {
      margin: 0 0 14px;
      padding: 12px 14px;
      background: var(--warning-bg);
      border: 1px solid #f2d493;
      color: var(--warning);
      border-radius: 8px;
      line-height: 1.45;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 700;
      background: #f8fafc;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      background: #edf2f7;
      color: #334155;
      font-size: 12px;
      white-space: nowrap;
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .langbar {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav" id="mainNav" aria-label="Autohub common menu">
      <div class="brand">Autohub</div>
      <a href="index.html" data-i18n="tireCalculator">Tire Calculator</a>
      <a href="pcd.html" class="active" data-i18n="pcdDatabase">PCD Database</a>
      <a href="fuel.html" data-i18n="fuel">Fuel Consumption</a>
      <a href="#" data-i18n="diagnostics">Diagnostics</a>
      <a href="#" data-i18n="engines">Engines</a>
      <a href="#" data-i18n="guides">Guides</a>
      <div class="langbar" aria-label="Language">
        <button type="button" data-lang="en" class="selected">EN</button>
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </nav>
  </header>

  <main>
    <h1 data-i18n="title">PCD Database</h1>
    <p class="lead" data-i18n="lead">Bolt pattern, center bore, thread size and approximate offset by make and model. The database includes vehicles from 1995 and newer.</p>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search: Audi A4, Golf, 5x112, 57.1">
      <button type="button" class="copy-link" id="copyLink" data-i18n="copyLink">Copy link</button>
    </div>
    <div class="quick-filters" id="quickFilters" aria-label="Popular PCD filters"></div>
    <div class="summary" id="resultSummary"></div>

    <section class="layout">
      <div class="panel">
        <h2 data-i18n="makes">Makes</h2>
        <div class="list" id="brands"></div>
      </div>

      <div class="panel">
        <h2 data-i18n="models">Models</h2>
        <div class="list" id="models"></div>
      </div>

      <div class="panel">
        <h2 data-i18n="sizes">Sizes</h2>
        <div id="details"></div>
      </div>
    </section>
  </main>

  <script src="pcd-data.js"></script>

        summaryFiltered: 'Gefunden: {makes} Marken, {models} Modelle und {records} Einträge für "{query}".',
        modelTitle: '{make} {model} — PCD und Mittenloch',
        chooseMake: 'Wähle eine Marke.',

        noRecords: 'Keine Einträge für diesen Filter.',

        market: 'Markt',
        centerBore: 'Mittenloch',
        thread: 'Gewinde',
        fastener: 'Befestigung',
        status: 'Status',
        guideTitle: 'So nutzt du diese Daten',
        guideText: 'Prüfe zuerst Baujahr, Markt und Generation. Bremsanlage, Ausstattung und Performance-Versionen können die Passung ändern, daher vor dem Kauf mit Handbuch, VIN-Daten oder einem Felgenspezialisten abgleichen.',
        fastenerBolts: 'Radschrauben',
        fastenerNuts: 'Radmuttern',
        statusNeedsReview: 'in Prüfung',
        statusVerified: 'geprüft'
      }
    };

    const data = typeof PCD_DATA !== 'undefined' ? PCD_DATA : [];

    let lang = 'en';
    let selectedBrand = null;
    let selectedModel = null;
    let activeQuickFilter = '';

    const brandsEl = document.getElementById('brands');
    const modelsEl = document.getElementById('models');
    const detailsEl = document.getElementById('details');
    const searchEl = document.getElementById('search');
    const copyLinkEl = document.getElementById('copyLink');
    const quickFiltersEl = document.getElementById('quickFilters');
    const resultSummaryEl = document.getElementById('resultSummary');
    const popularPcdFilters = ['5x100', '5x112', '5x114.3', '5x120', '6x139.7'];

    function t(key) {
      return translations[lang][key] || translations.en[key] || key;
    }

    function fastenerLabel(value) {
      if (value === 'bolts') return t('fastenerBolts');
      if (value === 'nuts') return t('fastenerNuts');
      return value || '';
    }

    function statusLabel(value) {
      if (value === 'verified') return t('statusVerified');
      if (value === 'needs_review') return t('statusNeedsReview');
      return value || t('statusNeedsReview');
    }

    function currentQuery() {
      return searchEl.value.trim().toLowerCase();
    }

    function recordMatches(record, q) {
      if (!q) return true;
      return [
        record.generation,
        record.years,
        record.market,
        record.pcd,
        record.centerBore,
        record.thread,
        record.fastener,
        record.offset,
        record.status
      ].some(value => String(value || '').toLowerCase().includes(q));
    }

    function modelMatches(brand, model, q) {
      if (!q) return true;
      return brand.name.toLowerCase().includes(q)
        || model.name.toLowerCase().includes(q)
        || model.records.some(record => recordMatches(record, q));
    }

    function matchingModels(brand, q) {
      return brand.models.filter(model => modelMatches(brand, model, q));
    }

    function matchingRecords(model, q) {
      return model.records.filter(record => recordMatches(record, q));
    }

    function findBrandBySlug(slug) {
      return data.find(brand => brand.slug === slug);
    }

    function findModelBySlug(brand, slug) {
      return brand ? brand.models.find(model => model.slug === slug) : null;
    }

    function syncSelectionWithQuery() {
      const q = currentQuery();
      if (selectedBrand && !matchingModels(selectedBrand, q).length) {
        selectedBrand = null;
        selectedModel = null;
        return;
      }
      if (selectedModel && (!selectedBrand || !modelMatches(selectedBrand, selectedModel, q))) {
        selectedModel = null;
      }
    }

    function updateUrlState() {
      const params = new URLSearchParams(window.location.search);
      const query = searchEl.value.trim();
      if (query) {
        params.set('search', query);
      } else {
        params.delete('search');
      }
      if (lang && lang !== 'en') {
        params.set('lang', lang);
      } else {
        params.delete('lang');
      }
      if (selectedBrand) {
        params.set('make', selectedBrand.slug);
      } else {
        params.delete('make');
      }
      if (selectedBrand && selectedModel) {
        params.set('model', selectedModel.slug);
      } else {
        params.delete('model');
      }
      const queryString = params.toString();
      const nextUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
      window.history.replaceState(null, '', nextUrl);
    }

    function initFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const initialSearch = params.get('search') || '';
      const initialLang = params.get('lang');
      if (translations[initialLang]) {
        lang = initialLang;
      }
      searchEl.value = initialSearch;
      activeQuickFilter = popularPcdFilters.includes(initialSearch) ? initialSearch : '';
      selectedBrand = findBrandBySlug(params.get('make'));
      selectedModel = findModelBySlug(selectedBrand, params.get('model'));
      syncSelectionWithQuery();
    }

    function formatSummary(template, values) {
      return Object.keys(values).reduce((text, key) => text.replaceAll(`{${key}}`, values[key]), template);
    }

    function modelTitle() {
      if (!selectedBrand || !selectedModel) return '';
      return formatSummary(t('modelTitle'), {
        make: selectedBrand.name,
        model: selectedModel.name
      });
    }

    function filterStats(q) {
      const matchedBrands = data.filter(brand => matchingModels(brand, q).length > 0);
      const modelCount = matchedBrands.reduce((sum, brand) => sum + matchingModels(brand, q).length, 0);
      const recordCount = matchedBrands.reduce((sum, brand) => {
        return sum + matchingModels(brand, q).reduce((modelSum, model) => modelSum + matchingRecords(model, q).length, 0);
      }, 0);
      return { makes: matchedBrands.length, models: modelCount, records: recordCount };
    }

    function renderSummary() {
      const query = searchEl.value.trim();
      if (!query) {
        resultSummaryEl.textContent = t('summaryAll');
        return;
      }
      resultSummaryEl.textContent = formatSummary(t('summaryFiltered'), {
        ...filterStats(query.toLowerCase()),
        query
      });
    }

    function resetCopyButton() {
      copyLinkEl.textContent = t('copyLink');
    }

    async function copyCurrentLink() {
      updateUrlState();
      const url = window.location.href;
      try {
        await navigator.clipboard.writeText(url);
        copyLinkEl.textContent = t('copied');
        window.setTimeout(resetCopyButton, 1400);
      } catch (error) {
        window.prompt(t('copyLink'), url);
      }
    }

    function renderQuickFilters() {
      quickFiltersEl.innerHTML = popularPcdFilters.map((pcd) => `
        <button type="button" class="${activeQuickFilter === pcd ? 'selected' : ''}" data-pcd="${pcd}">${pcd}</button>
      `).join('');
      quickFiltersEl.querySelectorAll('[data-pcd]').forEach((button) => {
        button.addEventListener('click', () => {
          const value = button.dataset.pcd;
          activeQuickFilter = activeQuickFilter === value ? '' : value;
          searchEl.value = activeQuickFilter;
          syncSelectionWithQuery();
          updateUrlState();
          renderQuickFilters();
          renderSummary();
          renderBrands(searchEl.value);
          renderModels();
          renderDetails();
        });
      });
    }

    function translatePage() {
      document.documentElement.lang = lang;
      document.title = `Autohub ${t('pcdDatabase')}`;
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        node.textContent = t(node.dataset.i18n);
      });
      searchEl.placeholder = t('search');
      document.querySelectorAll('[data-lang]').forEach((button) => {
        button.classList.toggle('selected', button.dataset.lang === lang);
      });
      resetCopyButton();
      renderQuickFilters();
      renderSummary();
      renderModels();
      renderDetails();
    }

    function renderBrands(filter = '') {
      const q = filter.trim().toLowerCase();
      brandsEl.innerHTML = '';
      const brands = data
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name))
        .filter(brand => matchingModels(brand, q).length > 0);

      if (!brands.length) {
        brandsEl.innerHTML = `<div class="empty">${t('noMakes')}</div>`;
        modelsEl.innerHTML = `<div class="empty">${t('chooseMake')}</div>`;
        detailsEl.innerHTML = `<div class="empty">${t('chooseModel')}</div>`;
        return;
      }

      brands.forEach(brand => {
          const button = document.createElement('button');
          const matchCount = matchingModels(brand, q).length;
          button.innerHTML = `<span class="list-row"><span>${brand.name}</span><span class="count">${matchCount}</span></span>`;
          button.className = selectedBrand === brand ? 'selected' : '';
          button.onclick = () => {
            selectedBrand = brand;
            selectedModel = null;
            updateUrlState();
            renderBrands(searchEl.value);
            renderModels();
            renderDetails();
          };
          brandsEl.appendChild(button);
        });
    }

    function renderModels() {
      modelsEl.innerHTML = '';
      if (!selectedBrand) {
        modelsEl.innerHTML = `<div class="empty">${t('chooseMake')}</div>`;
        return;
      }
      const q = currentQuery();
      const models = matchingModels(selectedBrand, q)
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name));

      if (!models.length) {
        modelsEl.innerHTML = `<div class="empty">${t('noModels')}</div>`;
        return;
      }

      models.forEach(model => {
        const button = document.createElement('button');
        const recordCount = matchingRecords(model, q).length;
        button.innerHTML = `<span class="list-row"><span>${model.name}</span><span class="count">${recordCount}</span></span>`;
        button.className = selectedModel === model ? 'selected' : '';
        button.onclick = () => {
          selectedModel = model;
          updateUrlState();
          renderModels();
          renderDetails();
        };
        modelsEl.appendChild(button);
      });
    }

    function renderDetails() {
      if (!selectedModel) {
        detailsEl.innerHTML = `<div class="empty">${t('chooseModel')}</div>`;
        return;
      }
      const q = currentQuery();
      const records = matchingRecords(selectedModel, q);
      if (!records.length) {
        detailsEl.innerHTML = `<div class="empty">${t('noRecords')}</div>`;
        return;
      }
      const rows = records.map(record => `
        <tr>
          <td>${record.generation || ''}</td>
          <td>${record.years || ''}</td>
          <td>${record.market || ''}</td>
          <td><strong>${record.pcd || ''}</strong></td>
          <td>${record.centerBore || ''} mm</td>
          <td>${record.thread || ''}</td>
          <td>${fastenerLabel(record.fastener)}</td>
          <td>${record.offset || ''}</td>
          <td><span class="tag">${statusLabel(record.status)}</span></td>
        </tr>
      `).join('');
      detailsEl.innerHTML = `
        <h3 class="details-title">${modelTitle()}</h3>
        <div class="notice">${t('notice')}</div>
        <table>
          <thead>
            <tr>
              <th>${t('generation')}</th>
              <th>${t('years')}</th>
              <th>${t('market')}</th>
              <th>PCD</th>
              <th>${t('centerBore')}</th>
              <th>${t('thread')}</th>
              <th>${t('fastener')}</th>
              <th>ET</th>
              <th>${t('status')}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="guide">
          <strong>${t('guideTitle')}</strong>
          ${t('guideText')}
        </div>
      `;
    }

    document.querySelectorAll('[data-lang]').forEach((button) => {
      button.addEventListener('click', () => {
        lang = button.dataset.lang;
        updateUrlState();
        translatePage();
      });
    });

    copyLinkEl.addEventListener('click', copyCurrentLink);

    searchEl.addEventListener('input', () => {
      activeQuickFilter = popularPcdFilters.includes(searchEl.value.trim()) ? searchEl.value.trim() : '';
      syncSelectionWithQuery();
      updateUrlState();
      renderQuickFilters();
      renderSummary();
      renderBrands(searchEl.value);
      renderModels();
      renderDetails();
    });
    initFromUrl();
    renderBrands(searchEl.value);
    renderQuickFilters();
    renderSummary();
    translatePage();
  </script>
</body>
</html>
